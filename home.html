<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Report Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h4 mb-0">Stock Report Generator</h2>
                    </div>
                    <div class="card-body">
                        <form action="/generate_report" method="post">
                            <div class="mb-3">
                                <label for="ticker" class="form-label">Ticker Symbol</label>
                                <input type="text" class="form-control" id="ticker" name="ticker" 
                                       placeholder="e.g., AAPL, TSLA, MSFT" required>
                                <div class="form-text">Enter a valid stock ticker symbol.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Generate Report</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
